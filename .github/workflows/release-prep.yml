name: Release preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Scan source
        env:
          LATTICE_ALLOW_GIT_METADATA: "1"
        run: node scripts/scan-public-export.mjs
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - name: Inspect package contents without publishing
        run: npm pack --dry-run
      - name: Publication disabled
        run: node -e "if (!require('./package.json').private) process.exit(1)"
