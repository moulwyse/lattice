name: Release preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Scan source
        env:
          LATTICE_ALLOW_GIT_METADATA: "1"
        run: node scripts/scan-public-export.mjs
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - name: Inspect package contents without publishing
        run: npm pack --dry-run
      - name: Publication disabled
        run: node -e "if (!require('./package.json').private) process.exit(1)"
