name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior, alternatives, and compatibility impact.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Does this affect a security boundary?
      options:
        - "No"
        - "Possibly"
        - "Yes"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This request contains no credentials, private source, transcripts, or provider session data.
          required: true
