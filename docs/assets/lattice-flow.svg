<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">How Lattice handles a coding-agent task</title>
  <desc id="desc">A six-step flow from repository discovery through bounded context, agent work, patch validation, isolated application, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1120" height="360" rx="28" fill="url(#bg)"/>
  <path d="M90 180H1030" stroke="#334155" stroke-width="3" stroke-dasharray="7 9"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(95 180)" filter="url(#shadow)">
      <circle r="54" fill="#13233d" stroke="#38bdf8" stroke-width="2"/>
      <text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">DISCOVER</text>
      <text y="18" fill="#94a3b8" font-size="12">safe repo root</text>
    </g>
    <g transform="translate(281 180)" filter="url(#shadow)">
      <circle r="54" fill="#13233d" stroke="#5eead4" stroke-width="2"/>
      <text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">INDEX</text>
      <text y="18" fill="#94a3b8" font-size="12">local structure</text>
    </g>
    <g transform="translate(467 180)" filter="url(#shadow)">
      <circle r="54" fill="#13233d" stroke="#818cf8" stroke-width="2"/>
      <text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">BOUND</text>
      <text y="18" fill="#94a3b8" font-size="12">task context</text>
    </g>
    <g transform="translate(653 180)" filter="url(#shadow)">
      <circle r="54" fill="#13233d" stroke="#a78bfa" stroke-width="2"/>
      <text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">AGENT</text>
      <text y="18" fill="#94a3b8" font-size="12">proposes edits</text>
    </g>
    <g transform="translate(839 180)" filter="url(#shadow)">
      <circle r="54" fill="#13233d" stroke="#f0abfc" stroke-width="2"/>
      <text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">CHECK</text>
      <text y="18" fill="#94a3b8" font-size="12">fingerprints</text>
    </g>
    <g transform="translate(1025 180)" filter="url(#shadow)">
      <circle r="54" fill="#13233d" stroke="#4ade80" stroke-width="2"/>
      <text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">VERIFY</text>
      <text y="18" fill="#94a3b8" font-size="12">tests + evidence</text>
    </g>
    <text x="560" y="58" fill="url(#accent)" font-size="24" font-weight="800">BOUNDED CONTEXT. VERIFIED PATCHES. VISIBLE STATE.</text>
    <text x="560" y="316" fill="#94a3b8" font-size="15">Lattice keeps repository context selection and edit verification explicit.</text>
  </g>
</svg>
