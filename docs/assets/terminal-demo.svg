<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Lattice credential-free benchmark demonstration</title>
  <desc id="desc">A terminal window showing a Lattice mock benchmark loading bounded context, applying a patch, running verification, and passing.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1120" height="560" rx="30" fill="#070c16"/>
  <g transform="translate(55 45)" filter="url(#shadow)">
    <rect width="1010" height="470" rx="18" fill="url(#frame)" stroke="#26364f" stroke-width="2"/>
    <path d="M0 64H1010" stroke="#26364f" stroke-width="2"/>
    <circle cx="30" cy="32" r="8" fill="#fb7185"/>
    <circle cx="56" cy="32" r="8" fill="#fbbf24"/>
    <circle cx="82" cy="32" r="8" fill="#4ade80"/>
    <text x="505" y="39" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle">Lattice local smoke test · no model account required</text>
    <g font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="20">
      <text x="38" y="110" fill="#6ee7f9">$ lattice benchmark --worker mock</text>
      <text x="38" y="156" fill="#cbd5e1">[task.compiled]</text><text x="245" y="156" fill="#94a3b8">Compiled task</text>
      <text x="38" y="196" fill="#cbd5e1">[index.completed]</text><text x="245" y="196" fill="#94a3b8">Indexed 6 synthetic files</text>
      <text x="38" y="236" fill="#cbd5e1">[context.initial]</text><text x="245" y="236" fill="#94a3b8">Loaded 5 bounded pages</text>
      <text x="38" y="276" fill="#cbd5e1">[patch.checked]</text><text x="245" y="276" fill="#94a3b8">Resolved 2 fingerprinted edit grants</text>
      <text x="38" y="316" fill="#cbd5e1">[verification]</text><text x="245" y="316" fill="#94a3b8">Applied 2 changes in an isolated worktree</text>
      <text x="38" y="356" fill="#cbd5e1">[task.passed]</text><text x="245" y="356" fill="#4ade80">Verification and acceptance evidence passed</text>
      <text x="38" y="412" fill="#f8fafc" font-weight="700">Status: </text><text x="132" y="412" fill="#4ade80" font-weight="700">passed</text>
    </g>
  </g>
</svg>
